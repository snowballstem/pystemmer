name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push, or for pull requests against main
  push:
    paths-ignore:
      - AUTHORS
      - README.rst
  pull_request:
    branches: [ main ]
    paths-ignore:
      - AUTHORS
      - README.rst

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', 'pypy3.7', 'pypy3.8', 'pypy3.9', 'pypy3.10']
        include:
          # setup-python doesn't provide Python 3.8/3.9 for Ubuntu 26.04.
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install build dependencies
      run: pip install Cython setuptools wheel
    - name: Install
      run: pip install .
    - name: Install pytest
      run: pip install pytest
    - name: Run tests
      run: |
        printf 'Running tests with '; python --version
        python runtests.py -v
        pytest -v
    - name: Build source distribution
      if: matrix.python-version == '3.14'
      run: python setup.py sdist
    - name: Build wheel from source distribution without network
      if: matrix.python-version == '3.14'
      env:
        PIP_NO_INDEX: "1"
        http_proxy: http://127.0.0.1:9
        https_proxy: http://127.0.0.1:9
      run: |
        python -m pip wheel \
          --no-build-isolation \
          --no-deps \
          --wheel-dir /tmp/wheels \
          dist/*.tar.gz
